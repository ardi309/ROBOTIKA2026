<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><title>03 / Kendali dan monitoring melalui cloud</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2159b8"/></marker></defs><rect width="1200" height="620" fill="#f2f6fc"/><g font-family="Helvetica,sans-serif"><text x="42" y="53" fill="#172b49" font-size="30" font-weight="700" text-anchor="start">03 / Kendali dan monitoring melalui cloud</text><text x="42" y="88" fill="#172b49" font-size="18" font-weight="400" text-anchor="start">Pin virtual Blynk berbeda dari pin GPIO pada board.</text><rect x="45" y="170" width="280" height="118" rx="14" fill="white" stroke="#2159b8" stroke-width="2"/><text x="65" y="204" fill="#2159b8" font-size="21" font-weight="700" text-anchor="start">Dashboard Blynk</text><text x="65" y="233" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">V2: setpoint PWM</text><text x="65" y="257" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">V3: enable OFF / ON</text><rect x="465" y="170" width="270" height="118" rx="14" fill="white" stroke="#2159b8" stroke-width="2"/><text x="485" y="204" fill="#2159b8" font-size="21" font-weight="700" text-anchor="start">Blynk.Cloud</text><text x="485" y="233" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Datastream per device</text><text x="485" y="257" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Perintah dan telemetri</text><rect x="875" y="170" width="280" height="118" rx="14" fill="white" stroke="#2159b8" stroke-width="2"/><text x="895" y="204" fill="#2159b8" font-size="21" font-weight="700" text-anchor="start">ESP32 + iMCLab</text><text x="895" y="233" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Wi-Fi + PWM + sensor</text><text x="895" y="257" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Keluaran awal OFF</text><path d="M 325 212 L 452.0 212.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="465,212 452.0,218.0 452.0,206.0" fill="#2159b8"/><text x="395.0" y="200.0" fill="#2159b8" font-size="16" font-weight="400" text-anchor="middle">Internet</text><path d="M 735 212 L 862.0 212.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="875,212 862.0,218.0 862.0,206.0" fill="#2159b8"/><text x="805.0" y="200.0" fill="#2159b8" font-size="16" font-weight="400" text-anchor="middle">Wi-Fi</text><path d="M 1015 288 L 1015.0 389.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="1015,402 1009.0,389.0 1021.0,389.0" fill="#2159b8"/><path d="M 1015 402 L 198.0 402.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="185,402 198.0,396.0 198.0,408.0" fill="#2159b8"/><text x="600.0" y="380" fill="#2159b8" font-size="16" font-weight="400" text-anchor="middle">V0: RPM | V1: PWM aktual | V2: setpoint | V3: enable</text><path d="M 185 402 L 185.0 301.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="185,288 191.0,301.0 179.0,301.0" fill="#2159b8"/><text x="45" y="482" fill="#2159b8" font-size="23" font-weight="700" text-anchor="start">V2 positif saat OFF menyimpan setpoint; V1 tetap nol.</text><text x="45" y="524" fill="#172b49" font-size="20" font-weight="400" text-anchor="start">Koneksi putus terdeteksi -&gt; motor OFF. Reconnect -&gt; perlu ON kembali.</text><text x="42" y="590" fill="#566984" font-size="15" font-weight="400" text-anchor="start">ILUSTRASI RANCANGAN | Bukan foto, screenshot, atau hasil ukur.</text></g></svg>