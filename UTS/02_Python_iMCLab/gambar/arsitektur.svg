<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><title>02 / Python sebagai antarmuka kendali</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2159b8"/></marker></defs><rect width="1200" height="620" fill="#f2f6fc"/><g font-family="Helvetica,sans-serif"><text x="42" y="53" fill="#172b49" font-size="30" font-weight="700" text-anchor="start">02 / Python sebagai antarmuka kendali</text><text x="42" y="88" fill="#172b49" font-size="18" font-weight="400" text-anchor="start">Python berjalan di komputer; firmware motor tetap di ESP32.</text><rect x="45" y="170" width="300" height="118" rx="14" fill="white" stroke="#2159b8" stroke-width="2"/><text x="65" y="204" fill="#2159b8" font-size="21" font-weight="700" text-anchor="start">Python di komputer</text><text x="65" y="233" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Validasi + pilih COM</text><text x="65" y="257" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Kirim perintah, tunggu ACK</text><rect x="785" y="170" width="370" height="118" rx="14" fill="white" stroke="#2159b8" stroke-width="2"/><text x="805" y="204" fill="#2159b8" font-size="21" font-weight="700" text-anchor="start">ESP32 + driver + motor</text><text x="805" y="233" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Firmware Modul 01</text><text x="805" y="257" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">PWM dan sensor dijalankan lokal</text><path d="M 345 205 L 772.0 205.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="785,205 772.0,211.0 772.0,199.0" fill="#2159b8"/><text x="565.0" y="188" fill="#2159b8" font-size="16" font-weight="400" text-anchor="middle">USB serial: PWM:120 + newline</text><path d="M 785 258 L 358.0 258.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="345,258 358.0,252.0 358.0,264.0" fill="#2159b8"/><text x="565.0" y="296" fill="#2159b8" font-size="16" font-weight="400" text-anchor="middle">ACK / DATA / STATUS</text><rect x="45" y="390" width="450" height="118" rx="14" fill="white" stroke="#087d82" stroke-width="2"/><text x="65" y="424" fill="#087d82" font-size="21" font-weight="700" text-anchor="start">Log CSV dari serial</text><text x="65" y="453" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Waktu terima, TX/RX, teks asli</text><text x="65" y="477" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">PWM, setpoint, RPM, pulsa, durasi</text><path d="M 195 288 L 195.0 377.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="195,390 189.0,377.0 201.0,377.0" fill="#2159b8"/><text x="555" y="427" fill="#2159b8" font-size="22" font-weight="700" text-anchor="start">ACK = perintah diproses.</text><text x="555" y="461" fill="#172b49" font-size="20" font-weight="400" text-anchor="start">Gerak dan RPM tetap perlu diamati.</text><text x="42" y="590" fill="#566984" font-size="15" font-weight="400" text-anchor="start">ILUSTRASI RANCANGAN | Bukan foto, screenshot, atau hasil ukur.</text></g></svg>