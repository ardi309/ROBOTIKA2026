<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><title>01 / Memahami duty cycle</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2159b8"/></marker></defs><rect width="1200" height="400" fill="#f2f6fc"/><g font-family="Helvetica,sans-serif"><text x="42" y="53" fill="#172b49" font-size="30" font-weight="700" text-anchor="start">01 / Memahami duty cycle</text><text x="42" y="88" fill="#172b49" font-size="18" font-weight="400" text-anchor="start">Sinyal teoritis; bukan hasil pengukuran osiloskop.</text><text x="45" y="125" fill="#2159b8" font-size="22" font-weight="700" text-anchor="start">25% duty (ilustrasi)</text><polyline points="360,200 360,200 360,110 405.0,110 405.0,200 540,200 540,200 540,110 585.0,110 585.0,200 720,200 720,200 720,110 765.0,110 765.0,200 900,200 900,200 900,110 945.0,110 945.0,200 1080,200" fill="none" stroke="#087d82" stroke-width="4"/><text x="300" y="116" fill="#172b49" font-size="15" font-weight="400" text-anchor="start">HIGH</text><text x="306" y="205" fill="#172b49" font-size="15" font-weight="400" text-anchor="start">LOW</text><text x="45" y="230" fill="#2159b8" font-size="22" font-weight="700" text-anchor="start">75% duty (ilustrasi)</text><polyline points="360,305 360,305 360,215 495.0,215 495.0,305 540,305 540,305 540,215 675.0,215 675.0,305 720,305 720,305 720,215 855.0,215 855.0,305 900,305 900,305 900,215 1035.0,215 1035.0,305 1080,305" fill="none" stroke="#087d82" stroke-width="4"/><text x="300" y="221" fill="#172b49" font-size="15" font-weight="400" text-anchor="start">HIGH</text><text x="306" y="310" fill="#172b49" font-size="15" font-weight="400" text-anchor="start">LOW</text><text x="45" y="340" fill="#172b49" font-size="20" font-weight="400" text-anchor="start">Periode dan amplitudo sama; proporsi HIGH berubah. PWM 8 bit: duty nominal = nilai / 255.</text><text x="42" y="370" fill="#566984" font-size="15" font-weight="400" text-anchor="start">ILUSTRASI RANCANGAN | Bukan foto, screenshot, atau hasil ukur.</text></g></svg>