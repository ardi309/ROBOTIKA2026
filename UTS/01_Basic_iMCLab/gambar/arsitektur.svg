<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><title>01 / Kendali dasar motor</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2159b8"/></marker></defs><rect width="1200" height="620" fill="#f2f6fc"/><g font-family="Helvetica,sans-serif"><text x="42" y="53" fill="#172b49" font-size="30" font-weight="700" text-anchor="start">01 / Kendali dasar motor</text><text x="42" y="88" fill="#172b49" font-size="18" font-weight="400" text-anchor="start">Pemetaan sinyal mengikuti kode kelas iMCLab.</text><rect x="45" y="160" width="245" height="118" rx="14" fill="white" stroke="#2159b8" stroke-width="2"/><text x="65" y="194" fill="#2159b8" font-size="21" font-weight="700" text-anchor="start">Serial Monitor</text><text x="65" y="223" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">115200 baud + newline</text><text x="65" y="247" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">0 / 1 / PWM:120</text><rect x="445" y="160" width="280" height="118" rx="14" fill="white" stroke="#2159b8" stroke-width="2"/><text x="465" y="194" fill="#2159b8" font-size="21" font-weight="700" text-anchor="start">ESP32 iMCLab</text><text x="465" y="223" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Parser + PWM 30 kHz</text><text x="465" y="247" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">GPIO12 / GPIO27 / 26</text><rect x="890" y="160" width="265" height="118" rx="14" fill="white" stroke="#2159b8" stroke-width="2"/><text x="910" y="194" fill="#2159b8" font-size="21" font-weight="700" text-anchor="start">Driver + motor</text><text x="910" y="223" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Catu sesuai kit</text><text x="910" y="247" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">Satu arah putaran</text><path d="M 290 215 L 432.0 215.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="445,215 432.0,221.0 432.0,209.0" fill="#2159b8"/><text x="367.5" y="203.0" fill="#2159b8" font-size="16" font-weight="400" text-anchor="middle">Perintah</text><path d="M 725 215 L 877.0 215.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="890,215 877.0,221.0 877.0,209.0" fill="#2159b8"/><text x="807.5" y="203.0" fill="#2159b8" font-size="16" font-weight="400" text-anchor="middle">PWM + arah</text><rect x="445" y="370" width="280" height="118" rx="14" fill="white" stroke="#087d82" stroke-width="2"/><text x="465" y="404" fill="#087d82" font-size="21" font-weight="700" text-anchor="start">Sensor pulsa</text><text x="465" y="433" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">GPIO13, FALLING</text><text x="465" y="457" fill="#172b49" font-size="17" font-weight="400" text-anchor="start">PPR perlu dikalibrasi</text><path d="M 1020 278 L 1020.0 414.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="1020,427 1014.0,414.0 1026.0,414.0" fill="#2159b8"/><path d="M 1020 427 L 738.0 427.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="725,427 738.0,421.0 738.0,433.0" fill="#2159b8"/><text x="872.5" y="410" fill="#2159b8" font-size="16" font-weight="400" text-anchor="middle">Gerak -&gt; pulsa</text><path d="M 585 370 L 585.0 291.0" stroke="#2159b8" stroke-width="3" fill="none"/><polygon points="585,278 591.0,291.0 579.0,291.0" fill="#2159b8"/><text x="610" y="335" fill="#087d82" font-size="17" font-weight="400" text-anchor="start">Monitoring RPM</text><text x="45" y="535" fill="#172b49" font-size="20" font-weight="400" text-anchor="start">RPM dipantau; belum ada pengendali yang mengoreksi PWM terhadap target RPM.</text><text x="42" y="590" fill="#566984" font-size="15" font-weight="400" text-anchor="start">ILUSTRASI RANCANGAN | Bukan foto, screenshot, atau hasil ukur.</text></g></svg>